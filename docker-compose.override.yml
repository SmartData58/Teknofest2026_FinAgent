# =============================================================================
# DEV override — 'docker compose up' ile OTOMATİK yüklenir.
#
# NE DEĞİŞTİ:
#  • embedding / reranker / llm blokları KALDIRILDI (servisler artık yok;
#    olmayan bir servise override yazmak compose'da hata verir).
#  • backend'in hf_cache bağlaması KALDIRILDI — HuggingFace modeli indirmiyoruz.
#  • ⚠️ backend'e ./backend:/app bağlandığı için repo kökündeki .env konteynerin
#    İÇİNDE GÖRÜNMEZ. Bu yüzden base dosyada `env_file: .env` şart (oradan
#    okunup ortam değişkeni olarak enjekte ediliyor). Aşağıdaki salt-okunur
#    bağlama, .env'i konteyner içinden de görünür kılar; evren_client elle
#    çalıştırıldığında (docker compose exec backend python evren_client.py)
#    dosyayı bulabilsin diye.
# =============================================================================

services:
  frontend:
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules

  backend:
    ports:
      - "8003:8000" # Vue buradan istek atacak
    volumes:
      - ./backend:/app
      # 🆕 .env'i konteyner içinde de görünür yap (SALT OKUNUR).
      # Not: uygulamanın çalışması buna bağlı DEĞİL — asıl yol base dosyadaki
      # env_file. Bu sadece "docker compose exec" ile elle script çalıştırmayı
      # kolaylaştırır.
      - ./.env:/app/.env:ro

  scraper:
    ports:
      - "8004:8002" # sol: host portu, sağ: konteyner portu
    volumes:
      - .:/app

  mongodb:
    ports:
      - "27017:27017"

  redis:
    # 🆕 Eskiden bu port base dosyada açılıyordu. Dev'e taşındı: prod'da
    # redis'in host'a açık olması gereksiz bir saldırı yüzeyidir.
    ports:
      - "6379:6379"

  # Yalnızca --profile yerel-vektor ile ayağa kalkar.
  qdrant:
    ports:
      - "6333:6333"
      - "6334:6334"