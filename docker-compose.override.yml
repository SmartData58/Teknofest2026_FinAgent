# ============================================================
# DEV override — 'docker compose up' ile OTOMATİK yüklenir.
# ============================================================

services:
  frontend:
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules

  backend:
    ports:
      - "8003:8000" # Vue buradan istek atacak
    volumes:
      - ./backend:/app
      - ./hf_cache:/root/.cache/huggingface  # <-- Modelleri bilgisayarına mühürleyecek satır
  embedding:
    ports:
      - "8001:8001"
    volumes:
      - ./models/embedding:/app

  reranker:
    ports:
      - "8002:8002"
    volumes:
      - ./models/reranker:/app

  llm:
    ports:
      - "11434:11434" # Ollama'nın varsayılan portu

  scraper:
    volumes:
      - ./scraper:/app


  postgres:
    ports:
      - "5432:5432"

  qdrant:
    ports:
      - "6333:6333"
      - "6334:6334"