# =============================================================================
# NVIDIA override — GPU'YU BACKEND İÇİN GERİ VERİR
#
# 🛠️ ÖNCEKİ ÖNERİMİ DÜZELTİYORUM. "Bu dosya artık gereksiz, sil" demiştim;
# gerekçem "çıkarımın tamamı uzak sunucuda, GPU'ya ihtiyaç kalmadı" idi.
# EKSİK OLAN ŞUYDU: OCR hâlâ YERELDE çalışıyor ve CUDA kullanıyor
# (bagimlilik_denetimi.py: torch -> ocr/unlimited.py). Yani backend'in GPU
# rezervasyonu gereksiz değildi — dosya yükleme yolunun hızı ona bağlı.
#
# ARTIK YALNIZCA BACKEND VAR. embedding / reranker / llm servisleri gerçekten
# kaldırıldı (hepsi yarışma API'sinde), o yüzden onların GPU blokları da gitti.
#
# KULLANIM (dev):
#     docker compose -f docker-compose.yml \
#                    -f docker-compose.override.yml \
#                    -f docker-compose.nvidia.yml up -d --build
#
# ⚠️ -f verdiğin anda override.yml OTOMATİK yüklenmez, yukarıdaki gibi
# ONU DA açıkça yazman gerekir.
#
# GPU gerçekten görünüyor mu, doğrula:
#     docker compose exec backend python -c "import torch; print(torch.cuda.is_available(), torch.cuda.get_device_name(0))"
# False dönerse OCR sessizce CPU'ya düşer ve yavaşlar — hata vermez, sadece
# yavaşlar. Bu yüzden bu kontrolü her kurulumdan sonra bir kez yap.
# =============================================================================

services:
  backend:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]