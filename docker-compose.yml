# =============================================================================
# SmartData — TEMEL (base) compose dosyası   [YARIŞMA API'SİNE GÖRE GÜNCELLENDİ]
#
# NE DEĞİŞTİ ve NEDEN:
#
# 1) ❌ embedding / reranker / llm servisleri KALDIRILDI.
#    Çıkarım artık yarışma API'sinden geliyor (evren_client.py -> llm-large,
#    llm-fast, router, bge-m3-embed, guard). Bu üç konteyner GPU ve RAM tüketip
#    hiçbir işe yaramıyordu. Silinmediler, git geçmişinde duruyorlar.
#
# 2) 🚨 env_file EKLENDİ — EN KRİTİK DÜZELTME.
#    Eskiden backend'e SADECE şu üç değişken veriliyordu:
#       EMBEDDING_API_URL / RERANKER_API_URL / LLM_API_URL
#    EVREN_API_KEY, EVREN_QDRANT_KEY, MONGO_URI gibi HİÇBİR anahtar
#    konteynere GİRMİYORDU. evren_client'ın kendi .env arayıcısı da onu
#    bulamaz, çünkü override yalnızca ./backend dizinini /app'e bağlıyor —
#    repo kökündeki .env konteynerin İÇİNDE YOK. Yani migrasyonlu kod deploy
#    edilse bile anahtarsız açılırdı.
#
# 3) 🚨 redis AĞ HATASI DÜZELTİLDİ.
#    redis servisinde `networks:` YOKTU. Compose'da bir servis ağ belirtmezse
#    `default` ağına düşer; backend ise smartdata-net'te. İkisi AYRI AĞDAYDI,
#    yani backend "redis" adını hiç çözemiyordu. Kod bu yüzden
#    host.docker.internal'a sarılmıştı (canlı logda görünüyor) — bu Docker
#    Desktop'a özel bir kaçış yolu, Linux sunucuda çalışmaz. Artık redis de
#    smartdata-net'te ve backend'e REDIS_HOST=redis veriliyor.
#
# 4) backend artık mongodb'nin SAĞLIKLI olmasını bekliyor ve kendi
#    healthcheck'i var (/health). Eskiden mongo'dan önce açılabiliyordu.
#
# 5) qdrant YEDEK olarak profile arkasına alındı (aşağıda açıklaması var).
# =============================================================================

services:
  # 1. Kullanıcı Arayüzü (Nuxt/Vue)
  frontend:
    build: ./frontend
    depends_on:
      - backend
    networks:
      - smartdata-net

  # 2. Ana API ve İş Mantığı (FastAPI)
  backend:
    build: ./backend
    # 🚨 Yarışma anahtarlarını konteynere sokan satır budur. Olmazsa
    # evren_client API_KEY'i boş görür ve her çağrı 401 döner.
    env_file:
      - .env
    environment:
      # Konteyner-içi adresler. .env'de aynı isimler varsa env_file'dan
      # gelen değeri BURASI EZER (compose'da `environment` > `env_file`),
      # bu yüzden yalnızca ağa özgü olanları burada tutuyoruz.
      - MONGO_URI=mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD:-admin123}@mongodb:27017/?authSource=admin
      # ⚠️ Değişken adını chatbot/redis_cache.py'den DOĞRULAYIN. Kod hangisini
      # okuyorsa o kalsın, diğerini silin — ikisi de zararsız ama kafa karıştırır.
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379/0
      - SCRAPER_URL=http://scraper:8002/scrape
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - smartdata-net
    healthcheck:
      # /health hem Qdrant hem evren durumunu döner; konteyner "sağlıklı"
      # görünmeden önce gerçekten cevap verebiliyor olması gerekir.
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=5).status==200 else 1)\""]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s

  # 3. Veri Kazıma Örümcekleri (Scrapy) + pipeline.py buradan çalışıyor
  scraper:
    build: ./scraper
    # pipeline.py ADIM 4, chatbot paketini import edemezse HTTP'ye düşüyor.
    # CHATBOT_SERVICE_URL olmadan varsayılan http://backend:8000 kullanılır;
    # yine de açıkça yazmak, servis adı değişirse tek yerden düzeltmeyi sağlar.
    env_file:
      - .env
    environment:
      - MONGO_HOST=mongodb
      - MONGO_USER=${MONGO_USER:-admin}
      - MONGO_PASSWORD=${MONGO_PASSWORD:-admin123}
      - MONGO_DB_NAME=${MONGO_DB_NAME:-smartdata}
      - MONGO_URI=mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD:-admin123}@mongodb:27017/?authSource=admin
      - CHATBOT_SERVICE_URL=http://backend:8000
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - smartdata-net

  # ---- Veritabanları ----

  mongodb:
    image: mongo:latest
    container_name: smartdata-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-admin123}
    volumes:
      - mongo_data:/data/db
    networks:
      - smartdata-net
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: smartdata-redis
    # 🚨 EKLENDİ — bkz. dosya başındaki 3. madde. Bu satır olmadan backend
    # redis'i AĞ SEVİYESİNDE göremiyordu.
    networks:
      - smartdata-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ---- YEDEK: yerel Qdrant ----
  # Normalde ÇALIŞMAZ. Yarışma Qdrant'ı (evren-vektor.ssyz.org.tr) kullanılıyor.
  # Yarışma sırasında o sunucu düşerse yerel yedeğe geçmek için:
  #     docker compose --profile yerel-vektor up -d qdrant
  #     .env'de:  EVREN_QDRANT_URL=http://qdrant:6333
  #               EVREN_QDRANT_KEY=      (boş bırak)
  #               EVREN_TEAM=            (boş bırak — prefix kullanılmaz)
  #     sonra:    python -m chatbot.indexing
  # (evren_client zaten EVREN_QDRANT_URL yoksa QDRANT_HOST'a, o da yoksa
  #  http://qdrant:6333'e düşüyor — yani kod değişikliği GEREKMİYOR.)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: smartdata-qdrant
    profiles: ["yerel-vektor"]
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - smartdata-net

  # ---- TAM KURUM İÇİ (ON-PREM) MOD: yerel LLM + yerel embedding ----
  #
  # Şartname 5.9 çözümün "dış servislere bağımlı olmadan" çalışabilmesini
  # istiyor. Mimari bunu KOD DEĞİŞİKLİĞİ OLMADAN karşılıyor: LLM, embedding ve
  # vektör adreslerinin üçü de ortam değişkeni (bkz. chatbot/evren_client.py —
  # BASE_URL, MODEL_ANA, MODEL_HIZLI, EVREN_QDRANT_URL). Ollama OpenAI uyumlu
  # bir /v1 ucu yayımladığı için mevcut ChatOpenAI istemcisi olduğu gibi çalışır.
  #
  # Tamamen kurum içi çalıştırmak için:
  #     docker compose --profile yerel-llm --profile yerel-vektor up -d ollama qdrant
  #     docker exec smartdata-ollama ollama pull qwen2.5:7b-instruct
  #     docker exec smartdata-ollama ollama pull bge-m3
  # .env'de:
  #     EVREN_BASE_URL=http://ollama:11434/v1
  #     EVREN_API_KEY=yerel            (Ollama anahtar doğrulamaz, boş olmasın)
  #     EVREN_MODEL=qwen2.5:7b-instruct
  #     EVREN_MODEL_HIZLI=qwen2.5:7b-instruct
  #     EVREN_EMBED_MODEL=bge-m3
  #     EVREN_QDRANT_URL=http://qdrant:6333
  #     EVREN_QDRANT_KEY=              (boş)
  #     EVREN_TEAM=                    (boş)
  # sonra vektörleri yerelde yeniden kur:
  #     docker exec teknofest2026_finagent-backend-1 python -m chatbot.indexing
  #
  # Bu modda hiçbir istek kurum ağının dışına çıkmaz; kural tabanlı bilgi
  # çıkarımı (nlp/extraction/rule_based.py) zaten LLM'siz çalışıyor.
  ollama:
    image: ollama/ollama:latest
    container_name: smartdata-ollama
    profiles: ["yerel-llm"]
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - smartdata-net
    # GPU'yu kullanmak için docker-compose.nvidia.yml ile birlikte başlatın.

networks:
  smartdata-net:
    driver: bridge

volumes:
  mongo_data:
  qdrant_data:
  # yerel-llm profili için (tam kurum içi mod).
  ollama_data: