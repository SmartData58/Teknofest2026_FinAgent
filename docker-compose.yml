# ============================================================
# SmartData — TEMEL (base) compose dosyası
# ============================================================

services:
  # 1. Kullanıcı Arayüzü (Nuxt/Vue)
  frontend:
    build: ./frontend
    depends_on:
      - backend
    networks:
      - smartdata-net

  # 2. Ana API ve İş Mantığı (FastAPI)
  backend:
    build: ./backend
    environment:
      # AI Servis Bağlantıları
      - EMBEDDING_API_URL=http://embedding:8001
      - RERANKER_API_URL=http://reranker:8002
      - LLM_API_URL=http://llm:8000
    depends_on:
      embedding:
        condition: service_started
      reranker:
        condition: service_started
      llm:
        condition: service_started
    networks:
      - smartdata-net

  # 3. AI: Embedding Modeli
  # 3. AI: Embedding Modeli
  embedding:
    build: ./models/embedding
    networks:
      - smartdata-net
    environment:
      - HF_TOKEN=${HF_TOKEN}
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
      # Daha önce konuştuğumuz kod eşleştirmesi varsa onu da alt satıra ekleyebilirsin:
      # - ./models/embedding:/app

  # 4. AI: Reranker Modeli
  reranker:
    build: ./models/reranker
    networks:
      - smartdata-net
    environment:
      - HF_TOKEN=${HF_TOKEN}
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
      # - ./models/reranker:/app

  # 5. AI: LLM Modeli (vLLM)
  llm:
    # İmaj (image) ve donanım (devices/deploy) ayarları 
    # nvidia/intel override dosyalarından otomatik gelecek!
    
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    environment:
      - HF_TOKEN=${HF_TOKEN}
    networks:
      - smartdata-net

  # 6. Veri Kazıma Örümcekleri (Scrapy)
  scraper:
    build: ./scraper
    environment:
      # --- MONGODB BAĞLANTI AYARLARI EKLENDİ ---
      - MONGO_HOST=mongodb
      - MONGO_USER=${MONGO_USER:-admin}
      - MONGO_PASSWORD=${MONGO_PASSWORD:-admin123}
      - MONGO_DB_NAME=${MONGO_DB_NAME:-smartdata}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - smartdata-net

  # ---- Veritabanları ----
      
  mongodb:
    image: mongo:latest
    container_name: smartdata-mongodb
    environment:
      # Güvenlik için kullanıcı adı ve şifre tanımlıyoruz.
      # .env dosyasından çekebilir veya varsayılan bırakabilirsin.
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-admin123}
    volumes:
      - mongo_data:/data/db
    networks:
      - smartdata-net
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: smartdata-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: smartdata-qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - smartdata-net

networks:
  smartdata-net:
    driver: bridge

volumes:
  mongo_data:
  qdrant_data: